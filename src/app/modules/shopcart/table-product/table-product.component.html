<div class="form-control m-2">
    <div class="display-6">
        Productos en stock
    </div>
    <div>
        <table class="table table-hover" >
            <thead>
                <th>#</th>
                <th>Producto</th>
                <th>Proveedor</th>
                <th>Categoria</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Opciones</th>
            </thead>
            <tbody>
                <tr *ngFor="let producto of listaproduct">
                    <td> {{ producto.id }} </td>
                    <td> {{ producto.product }} </td>
                    <td> {{ producto.provider }} </td>
                    <td [ngSwitch]="producto.category">
                        <div *ngSwitchCase="'OC'">
                            Ocio
                        </div>
                        <div *ngSwitchCase="'VA'">
                            Varios
                        </div>
                        <div *ngSwitchCase="'HT'">
                            Salud
                        </div>
                        <div *ngSwitchCase="'CO'">
                            Cocina
                        </div>
                        <div *ngSwitchDefault>
                            No definido
                        </div>
                    </td>
                    <td> {{ producto.price | currency }} </td>
                    <td> {{ producto.stock | quantityPipe }} </td>
                    <td>
                        <!-- <input class="btn btn-primary" type="button" value="Agregar"> -->
                        <button class="btn btn-primary" type="button" [disabled]="producto.stock == 0" (click)="aggProduct(producto)"><i class="fa fa-plus"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
